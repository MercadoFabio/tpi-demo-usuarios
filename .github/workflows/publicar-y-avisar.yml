name: Publicar librería y notificar al Shell

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@mercadofabio'

      - run: npm ci
      - run: npm version patch --prefix projects/usuarios-lib --no-git-tag-version
      - run: npx ng build usuarios-lib
      - run: npm publish ./dist/usuarios-lib
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar versión publicada
        run: |
          git config user.name "tpi-demo-bot"
          git config user.email "actions@github.com"
          git add projects/usuarios-lib/package.json
          git commit -m "chore(release): usuarios-lib $(node -p "require('./projects/usuarios-lib/package.json').version") [skip ci]"
          git push

      - name: Notificar al Shell
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.SHELL_DISPATCH_TOKEN }}
          repository: MercadoFabio/tpi-demo-shell
          event-type: update-remote-feature
          client-payload: '{"grupo":"usuarios","package_name":"@mercadofabio/usuarios-lib"}'
